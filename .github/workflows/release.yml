name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# the default GITHUB_TOKEN is read-only on new repos; creating the Release needs contents: write
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test transpile_tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: duckbridge-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: duckbridge-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            name: duckbridge-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: duckbridge-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: duckbridge-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/duckbridge ${{ matrix.name }}
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\duckbridge.exe ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # Actions artifact storage is quota-limited; the Release step below is what matters
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}

  extension:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux_amd64
            lib: libduckbridge_ext.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux_arm64
            lib: libduckbridge_ext.so
          - os: macos-14
            target: aarch64-apple-darwin
            platform: osx_arm64
            lib: libduckbridge_ext.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: osx_amd64
            lib: libduckbridge_ext.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows_amd64
            lib: duckbridge_ext.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ext-${{ matrix.target }}
          workspaces: extension
      - name: Build extension
        working-directory: extension
        run: cargo build --release --target ${{ matrix.target }}
      - name: Append DuckDB metadata footer
        working-directory: extension
        run: |
          mkdir -p build
          ./pack.sh target/${{ matrix.target }}/release/${{ matrix.lib }} build/duckbridge.duckdb_extension ${{ matrix.platform }} v1.5.6 v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # DuckDB derives the entry-point symbol from the file name, so the member must stay
          # duckbridge.duckdb_extension; the archive name carries the platform.
          PY=python3; command -v python3 >/dev/null || PY=python
          $PY -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1], 'w', zipfile.ZIP_DEFLATED, compresslevel=9); z.write(sys.argv[2], 'duckbridge.duckdb_extension'); z.close()" duckbridge-${{ matrix.platform }}.duckdb_extension.zip build/duckbridge.duckdb_extension
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: duckbridge-extension-${{ matrix.platform }}
          path: extension/duckbridge-${{ matrix.platform }}.duckdb_extension.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/duckbridge-${{ matrix.platform }}.duckdb_extension.zip
