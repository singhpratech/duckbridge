[package]
name = "duckbridge_ext"
version = "0.1.0"
edition = "2021"
description = "DuckBridge as a loadable DuckDB extension: bridge_import / bridge_export / bridge_run / bridge_transpile"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

# Separate workspace: the CLI bundles DuckDB, the extension must not.
[workspace]

[dependencies]
duckdb = { version = "1.10506", default-features = false, features = ["loadable-extension", "vscalar", "chrono", "uuid", "serde_json"] }
duckbridge = { path = "..", default-features = false }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
