[package]
name = "duckbridge"
version = "0.1.1"
edition = "2021"
description = "DuckBridge: move databases between DuckDB and SQL Server / PostgreSQL / Parquet, translate SQL between dialects, and ship results back as a restorable SQL Server .bak."
license = "MIT"
repository = "https://github.com/singhpratech/duckbridge"
homepage = "https://github.com/singhpratech/duckbridge"
documentation = "https://github.com/singhpratech/duckbridge#readme"
readme = "README.md"
keywords = ["duckdb", "sql-server", "mssql", "tsql", "postgresql"]
categories = ["command-line-utilities", "database"]
# The crate ships the library, the CLI and the translator tests; CI, shell scripts and the
# extension/ directory (its own Cargo package) stay out of the published package.
exclude = [".github/", "scripts/", ".gitignore", "extension/", "private/"]

[[bin]]
name = "duckbridge"
path = "src/main.rs"
required-features = ["bundled"]

[features]
# The CLI bundles DuckDB. The DuckDB extension (extension/) depends on this crate with
# default-features = false, features = ["duckdb-v1"] and links against the running DuckDB
# through the C API instead.
default = ["duckdb-v1", "bundled"]
bundled = ["duckdb-v1", "duckdb/bundled"]
# DuckDB backend (exactly one is needed; see src/core/duck.rs and docs/handoff-duck-layer.md):
# duckdb-v1 = duckdb-rs on the DuckDB 1.x C API. The `duckdb-neo` backend (DuckDB 2.0) builds from
# neo/Cargo.toml (same sources): its libduckdb-sys cannot share a dependency graph with this one
# (`links = "duckdb"`), see docs/handoff-neo.md.
duckdb-v1 = ["dep:duckdb"]

[lints.rust]
# `duckdb-neo` is a feature of neo/Cargo.toml, which compiles these same sources.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("duckdb-neo"))'] }

[dependencies]
duckdb = { version = "1.10506", default-features = false, features = ["chrono", "uuid", "serde_json"], optional = true }
tiberius = { version = "0.13", default-features = false, features = ["rustls", "chrono", "rust_decimal", "tds73"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["rustls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
indicatif = "0.17"
regex = "1"
tempfile = "3"
# <0.7.18: newer postgres-protocol wants hmac/sha2 0.11 final, while tiberius' sspi-rs pins their release candidates
tokio-postgres = { version = "0.7, <0.7.18", features = ["with-chrono-0_4", "with-uuid-1"] }
num_cpus = "1"
bytes = "1"
log = "0.4"
env_logger = "0.11"

# Windows authentication: process identity via SSPI on Windows, explicit DOMAIN\user NTLM
# credentials everywhere through the pure-Rust sspi crate (no system Kerberos libraries needed).
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }
[target.'cfg(unix)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["sspi-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
